<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fall Detection System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f2f5;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            max-width: 420px;
            margin: auto;
        }
        .status {
            font-size: 18px;
            font-weight: bold;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s ease;
        }
        .status.warning { background-color: #ff9800; }
        .status.countdown { background-color: #f44336; animation: blink 0.6s infinite alternate; }
        .status.sent { background-color: #9c27b0; }
        
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn-start { background-color: #008CBA; color: white; }
        .btn-cancel { 
            background-color: #ffffff; 
            color: #d32f2f; 
            border: 2px solid #d32f2f;
            font-size: 18px;
            display: none;
        }
        
        .sensor-data {
            margin-top: 15px;
            text-align: left;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Smart Fall Detection</h2>
    <p style="color: #666; font-size: 14px;">ระบบตรวจจับการล้ม + แจ้งเตือนพิกัด GPS</p>
    
    <button class="btn-start" onclick="requestPermissions()">เปิดระบบตรวจจับและ GPS</button>

    <div class="sensor-data">
        <p><strong>Vector Acc:</strong> <span id="acc-total">0.00</span> m/s²</p>
        <p><strong>สถานะ GPS:</strong> <span id="gps-status">ยังไม่ได้เชื่อมต่อ</span></p>
        <p><strong>ความนิ่งสะสม (Ratio):</strong> <span id="still-ratio-ui">0%</span></p>
    </div>

    <div id="status-box" class="status">สถานะ: ปิดทำงาน</div>
    
    <button id="cancel-btn" class="btn-cancel" onclick="cancelFallAlert()">✋ ฉันไม่เป็นไร (ยกเลิกแจ้งเตือน)</button>
</div>

<script>
    // --- Config ตั้งค่า Telegram ---
    const TELEGRAM_BOT_TOKEN = '8925481078:AAE-kE4w01jGngCQNHYiwayHJA5BlHnmtI4';
    const TELEGRAM_CHAT_ID = '7132040561';

    // --- Threshold การตรวจจับ ---
    const IMPACT_THRESHOLD = 16.0;     // แรงกระแทก (m/s²)
    const SETTLE_DELAY_MS = 1000;      // รอมือถือหยุดเด้ง 1 วินาที
    const INACTIVITY_TIME_MS = 3500;   // เช็คความนิ่งรวม 3.5 วินาที
    const COUNTDOWN_SECONDS = 10;
    
    // ช่วงความเร่งที่นับว่านิ่ง
    const STILL_MIN = 5.0; 
    const STILL_MAX = 14.0;

    // --- Variables ---
    let state = 'OFF'; 
    let impactTime = 0;
    
    let totalSamples = 0;
    let stillSamples = 0;

    let countdownTimer = null;
    let countdownLeft = COUNTDOWN_SECONDS;
    let currentLat = null;
    let currentLon = null;

    function requestPermissions() {
        // 1. ดึง GPS (ทำแบบแยกอิสระ ไม่บล็อกเซนเซอร์ความเคลื่อนไหว)
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    document.getElementById('gps-status').innerText = 'รับพิกัดสำเร็จ ✅';
                },
                (err) => {
                    document.getElementById('gps-status').innerText = 'ไม่สามารถดึง GPS ได้ (แต่ระบบยังทำงานได้)';
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        // 2. ขออนุญาต Sensor (iOS & Android)
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        startSystem();
                    } else {
                        alert('คุณไม่ได้อนุญาตให้เข้าถึง Motion Sensor');
                    }
                })
                .catch(err => {
                    console.error(err);
                    startSystem();
                });
        } else {
            startSystem();
        }
    }

    function startSystem() {
        window.removeEventListener('devicemotion', handleMotion); // ลบ Event เก่าป้องกันซ้ำ
        window.addEventListener('devicemotion', handleMotion);
        state = 'NORMAL';
        updateUI('พร้อมใช้งาน (เฝ้าระวังปกติ)', 'normal');
    }

    function handleMotion(event) {
        if (state === 'OFF' || state === 'COUNTDOWN' || state === 'ALERT_SENT') return;

        let acc = event.accelerationIncludingGravity;
        if (!acc || acc.x === null) return;

        let x = acc.x || 0;
        let y = acc.y || 0;
        let z = acc.z || 0;
        let totalAcc = Math.sqrt(x * x + y * y + z * z);

        document.getElementById('acc-total').innerText = totalAcc.toFixed(2);

        // State 1: สภาวะปกติ จับแรงกระแทก
        if (state === 'NORMAL') {
            if (totalAcc > IMPACT_THRESHOLD) {
                state = 'WAITING_INACTIVITY';
                impactTime = Date.now();
                totalSamples = 0;
                stillSamples = 0;
                updateUI('⚠️ ตรวจพบแรงกระแทก! กำลังเช็คความนิ่ง...', 'warning');
            }
        } 
        // State 2: เช็คการนิ่ง (Inactivity Check)
        else if (state === 'WAITING_INACTIVITY') {
            let elapsedTime = Date.now() - impactTime;

            if (elapsedTime > SETTLE_DELAY_MS) {
                totalSamples++;
                if (totalAcc >= STILL_MIN && totalAcc <= STILL_MAX) {
                    stillSamples++;
                }

                let currentRatio = Math.round((stillSamples / totalSamples) * 100);
                document.getElementById('still-ratio-ui').innerText = currentRatio + '%';
            }

            if (elapsedTime >= INACTIVITY_TIME_MS) {
                let stillRatio = (totalSamples > 0) ? (stillSamples / totalSamples) : 0;
                
                // ถ้านิ่งเกิน 60% ของเวลาทั้งหมด -> ถือว่านิ่งจริง
                if (stillRatio >= 0.60) {
                    startCountdown();
                } else {
                    resetToNormal(`ยกเลิก (พบการขยับตัว ${Math.round((1 - stillRatio) * 100)}%)`);
                }
            }
        }
    }

    function startCountdown() {
        state = 'COUNTDOWN';
        countdownLeft = COUNTDOWN_SECONDS;
        document.getElementById('cancel-btn').style.display = 'block';

        if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);

        updateUI(`🚨 ตรวจพบการล้ม! จะส่งแจ้งเตือนใน ${countdownLeft} วินาที`, 'countdown');

        countdownTimer = setInterval(() => {
            countdownLeft--;
            if (countdownLeft > 0) {
                updateUI(`🚨 ตรวจพบการล้ม! จะส่งแจ้งเตือนใน ${countdownLeft} วินาที`, 'countdown');
                if (navigator.vibrate) navigator.vibrate(300);
            } else {
                clearInterval(countdownTimer);
                executeSendAlert();
            }
        }, 1000);
    }

    function cancelFallAlert() {
        if (countdownTimer) clearInterval(countdownTimer);
        document.getElementById('cancel-btn').style.display = 'none';
        resetToNormal('ยกเลิกการส่งแจ้งเตือนแล้ว');
    }

    function executeSendAlert() {
        state = 'ALERT_SENT';
        document.getElementById('cancel-btn').style.display = 'none';
        updateUI('📡 กำลังส่งพิกัดแจ้งเตือนฉุกเฉิน...', 'sent');

        let mapLink = (currentLat && currentLon) 
            ? `\n📍 พิกัด GPS: https://maps.google.com/?q=${currentLat},${currentLon}`
            : '\n📍 ไม่สามารถระบุพิกัด GPS ได้';

        let messageText = encodeURIComponent(`🚨 [แจ้งเตือนด่วน] ตรวจพบผู้ใช้งานล้ม และไม่มีการตอบสนอง!${mapLink}`);
        let telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${messageText}`;

        fetch(telegramUrl)
            .then(res => res.json())
            .then(data => {
                updateUI('🚨 ส่งข้อความและพิกัดเข้า Telegram แล้ว!', 'countdown');
                setTimeout(() => resetToNormal('พร้อมใช้งาน (เฝ้าระวังปกติ)'), 8000);
            })
            .catch(err => {
                updateUI('❌ ส่ง Telegram ล้มเหลว', 'warning');
                setTimeout(() => resetToNormal('พร้อมใช้งาน (เฝ้าระวังปกติ)'), 5000);
            });
    }

    function resetToNormal(msg) {
        state = 'NORMAL';
        document.getElementById('cancel-btn').style.display = 'none';
        document.getElementById('still-ratio-ui').innerText = '0%';
        updateUI(msg, 'normal');
    }

    function updateUI(text, statusClass) {
        const box = document.getElementById('status-box');
        box.innerText = text;
        box.className = 'status ' + statusClass;
    }
</script>

</body>
</html>
