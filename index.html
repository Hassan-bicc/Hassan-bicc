<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fall Detection Test (Mobile Browser)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .status {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
        }
        .status.fall {
            background-color: #f44336;
            animation: blink 0.5s infinite alternate;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #008CBA;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Fall Detection Tester</h2>
    <p>สภาวะปกติ: ~9.8 m/s²</p>
    
    <button onclick="requestSensorPermission()">เริ่มต้นใช้งานเซนเซอร์</button>

    <div style="margin-top: 15px; text-align: left;">
        <p><strong>Vector Magnitude:</strong> <span id="acc-total">0.00</span> m/s²</p>
        <p><strong>Acc X:</strong> <span id="acc-x">0.00</span></p>
        <p><strong>Acc Y:</strong> <span id="acc-y">0.00</span></p>
        <p><strong>Acc Z:</strong> <span id="acc-z">0.00</span></p>
    </div>

    <div id="status-box" class="status">สถานะ: ปกติ</div>
</div>

<script>
    // --- ตั้งค่า Threshold ---
    const IMPACT_THRESHOLD = 25.0; // แรงกระแทก (m/s²)
    const INACTIVITY_TIME_MS = 3000; // ระยะเวลาที่ต้องนิ่ง (3 วินาที)
    const STILL_MIN = 8.0;  // ค่าความเร่งต่ำสุดช่วงอยู่นิ่ง
    const STILL_MAX = 11.5; // ค่าความเร่งสูงสุดช่วงอยู่นิ่ง

    // --- สถานะการทำงาน ---
    let state = 'NORMAL'; // 'NORMAL', 'WAITING_INACTIVITY', 'FALL_CONFIRMED'
    let impactTime = 0;
    let isStill = true;

    function requestSensorPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') startListening();
                    else alert('คุณไม่ได้อนุญาตให้เข้าถึง Motion Sensor');
                })
                .catch(console.error);
        } else {
            startListening();
        }
    }

    function startListening() {
        window.addEventListener('devicemotion', handleMotion);
        alert('เปิดใช้งานระบบตรวจจับแบบ 2 ขั้นตอนแล้ว');
    }

    function handleMotion(event) {
        let acc = event.accelerationIncludingGravity;
        if (!acc || acc.x === null) return;

        let x = acc.x || 0;
        let y = acc.y || 0;
        let z = acc.z || 0;

        // คำนวณความเร่งรวม (Magnitude)
        let totalAcc = Math.sqrt(x * x + y * y + z * z);

        // แสดงผลค่าบนหน้าจอ
        document.getElementById('acc-x').innerText = x.toFixed(2);
        document.getElementById('acc-y').innerText = y.toFixed(2);
        document.getElementById('acc-z').innerText = z.toFixed(2);
        document.getElementById('acc-total').innerText = totalAcc.toFixed(2);

        // --- State Machine อัลกอริทึม ---
        
        // 1. สภาวะปกติ: รอจับแรงกระแทก
        if (state === 'NORMAL') {
            if (totalAcc > IMPACT_THRESHOLD) {
                state = 'WAITING_INACTIVITY';
                impactTime = Date.now();
                isStill = true; // สมมติให้นิ่งไว้ก่อน
                updateStatusUI('⚠️ ตรวจพบแรงกระแทก! กำลังเช็คการเคลื่อนไหว...', 'warning');
            }
        } 
        
        // 2. สภาวะเฝ้าระวัง: เช็คว่าเครื่องนิ่งจริงไหมในช่วงเวลาที่กำหนด
        else if (state === 'WAITING_INACTIVITY') {
            let elapsedTime = Date.now() - impactTime;

            // ถ้ามีการขยับแรงเกินช่วงนิ่ง ให้ยกเลิกการเตือน (False Alarm)
            if (totalAcc < STILL_MIN || totalAcc > STILL_MAX) {
                isStill = false; 
            }

            // เมื่อครบกำหนดเวลา 3 วินาที
            if (elapsedTime >= INACTIVITY_TIME_MS) {
                if (isStill) {
                    // นิ่งจริง -> ยืนยันว่าล้ม
                    triggerFallConfirmed();
                } else {
                    // มีการขยับ/หยิบขึ้นมา -> รีเซ็ตเป็นปกติ
                    resetToNormal('ยกเลิก (พบการขยับตัวหลังกระแทก)');
                }
            }
        }
    }

    function triggerFallConfirmed() {
        state = 'FALL_CONFIRMED';
        updateStatusUI('🚨 ยืนยันการล้ม! (FALL CONFIRMED)', 'fall');

        if (navigator.vibrate) {
            navigator.vibrate([500, 200, 500, 200, 500]);
        }

        // คืนค่าปกติหลังแสดงเตือน 5 วินาที
        setTimeout(() => {
            resetToNormal('สถานะ: ปกติ');
        }, 5000);
    }

    function resetToNormal(message) {
        state = 'NORMAL';
        updateStatusUI(message, 'normal');
    }

    function updateStatusUI(text, type) {
        const statusBox = document.getElementById('status-box');
        statusBox.innerText = text;
        statusBox.className = 'status'; // รีเซ็ต class
        
        if (type === 'fall') statusBox.classList.add('fall');
        else if (type === 'warning') statusBox.style.backgroundColor = '#ff9800';
        else statusBox.style.backgroundColor = '#4CAF50';
    }
</script>

</body>
</html>
